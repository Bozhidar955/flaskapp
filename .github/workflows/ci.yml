
name: My First CI Pipeline

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository code
        uses: actions/checkout@v4

      - name: Show project files
        run: ls -la

      - name: Print success message
        run: echo "CI pipeline is working!"

